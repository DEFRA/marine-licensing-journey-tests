name: Code Quality & Journey Tests

permissions:
  checks: write
  pull-requests: write

on:
  # Manual trigger
  workflow_dispatch:

  # Called by other workflows
  workflow_call:

  # Trigger on pushes to any branch
  push:

  # Trigger on pull requests
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  test-and-validate:
    name: Code Quality & Journey Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code quality checks
        run: |
          npm run format:check
          npm run lint

      - name: Install Redis CLI for health checks
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Start application services
        env:
          MARINE_LICENSING_FRONTEND_VERSION: latest
          MARINE_LICENSING_BACKEND_VERSION: latest
        run: |
          docker compose up --wait-timeout 300 -d --quiet-pull

      - name: Wait for services to be ready
        run: |
          echo "Waiting for selenium-chrome to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4444/wd/hub/status; do sleep 5; done'
          echo "Waiting for backend to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'
          echo "Waiting for Defra ID stub to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3200/health; do sleep 5; done'
          echo "Waiting for frontend to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
          echo "All services are ready!"

      - name: Verify local infrastructure
        run: |
          echo "=== Verifying Local Infrastructure ==="
          echo "✅ Selenium Chrome: $(curl -s http://localhost:4444/wd/hub/status | jq -r .ready)"
          echo "✅ Frontend Health: $(curl -s http://localhost:3000/health || echo 'FAILED')"
          echo "✅ Backend Health: $(curl -s http://localhost:3001/health || echo 'FAILED')"
          echo "✅ Defra ID Stub: $(curl -s http://localhost:3200/health || echo 'FAILED')"
          echo "✅ LocalStack: $(curl -s http://localhost:4566/health | jq -r .status || echo 'FAILED')"
          echo ""
          echo "=== Defra ID Stub User Registration Test ==="
          echo "Checking if user registration init container completed..."
          docker compose ps defra-id-user-init
          echo "Testing dynamic user registration endpoint..."
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"userId":"test-connection","email":"test@example.com","firstName":"Test","lastName":"Connection","loa":"1","aal":"1","enrolmentCount":1,"enrolmentRequestCount":1,"relationships":[{"organisationName":"Test Org","relationshipRole":"Employee","roleName":"Test Role","roleStatus":"1"}]}' \
            http://localhost:3200/cdp-defra-id-stub/API/register || echo "FAILED"
          echo "✅ MongoDB: $(curl -s http://localhost:27017 >/dev/null && echo 'RUNNING' || echo 'FAILED')"
          echo "✅ Redis: $(redis-cli -h localhost -p 6379 ping 2>/dev/null || echo 'FAILED')"
          echo ""
          echo "=== Container Status ==="
          docker compose ps

      - name: Run WebDriverIO tests with local infrastructure
        env:
          CHROMEDRIVER_URL: localhost
          CHROMEDRIVER_PORT: 4444
          # Use local infrastructure endpoints
          LOCALSTACK_URL: http://localhost:4566
          DEFRA_ID_URL: http://localhost:3200
        run: npm run test:github

      - name: Generate Allure report
        if: always()
        run: npm run report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: ./allure-results/screenshots
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker ps -a
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs marine-licensing-frontend || echo "Frontend container not found"
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs marine-licensing-backend || echo "Backend container not found"
          echo ""
          echo "=== Defra ID Stub Logs ==="
          docker compose logs defra-id-stub || echo "Defra ID stub container not found"
          echo ""
          echo "=== Defra ID User Init Logs ==="
          docker compose logs defra-id-user-init || echo "Defra ID user init container not found"
          echo ""
          echo "=== Selenium Chrome Logs ==="
          docker compose logs selenium-chrome || echo "Selenium container not found"

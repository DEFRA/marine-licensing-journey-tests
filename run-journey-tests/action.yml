name: Run Journey Tests on GitHub

inputs:
  marine-licensing-backend:
    required: false
    type: string
  marine-licensing-frontend:
    required: false
    type: string
  branch:
    required: false
    type: string
    default: main

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/marine-licensing-journey-tests
        path: ./marine-licensing-journey-tests

    - name: Extract dependent Pull Requests
      uses: depends-on/depends-on-action@0.15.0
      with:
        token: ${{ github.token }}
        path: ./marine-licensing-journey-tests

    - name: Determine journey-tests branch
      if: github.repository != 'DEFRA/marine-licensing-journey-tests'
      id: resolve_tests_branch
      shell: bash
      run: |
        set -e

        DEFAULT_BRANCH="${{ inputs.branch }}"
        BRANCH_TO_USE="$DEFAULT_BRANCH"

        DEPENDS_FILE='./marine-licensing-journey-tests/depends-on.json'
        ROOT_DEPENDS_FILE='./depends-on.json'

        resolve_branch_from_depends() {
          local file="$1"
          local branch=""

          branch=$(jq -r '.dependencies[]? | select(.repo == "DEFRA/marine-licensing-journey-tests") | .ref // empty' "$file" 2>/dev/null | head -1)

          if [ -z "$branch" ]; then
            local description
            description=$(jq -r '.description // empty' "$file" 2>/dev/null)
            if [ -n "$description" ]; then
              local depends_lines
              depends_lines=$(printf '%s\n' "$description" | grep -iE '^\s*depends[- ]?on[: ]+' || true)

              if [ -n "$depends_lines" ] && ! printf '%s\n' "$depends_lines" | grep -qiE 'https://github.com/.*/pull/[0-9]+'; then
                local invalid_placeholder
                invalid_placeholder=$(printf '%s\n' "$depends_lines" | sed -nE 's/.*(<[^>]*-pr-link>).*/\1/p' | head -1)

                if [ -z "$invalid_placeholder" ]; then
                  invalid_placeholder='<pr-link>'
                fi

                >&2 echo "ValueError: Invalid URL $invalid_placeholder"
                exit 1
              fi

              local dep_line
              dep_line=$(printf '%s\n' "${depends_lines:-$description}" | grep -iE 'depends[- ]?on[: ]+.*marine-licensing-journey-tests' | head -1 || true)
              if [ -n "$dep_line" ]; then
                local candidate
                candidate=$(printf '%s\n' "$dep_line" | sed -E 's#^.*marine-licensing-journey-tests[@:]+([A-Za-z0-9._/\-]+).*$#\1#I')
                if [ -n "$candidate" ] && [ "$candidate" != "$dep_line" ]; then
                  branch="$candidate"
                else
                  local pr_num
                  pr_num=$(printf '%s\n' "$dep_line" | sed -nE 's#.*marine-licensing-journey-tests.*/pull/([0-9]+).*#\1#p')
                  if [ -z "$pr_num" ]; then
                    pr_num=$(printf '%s\n' "$dep_line" | sed -nE 's#.*marine-licensing-journey-tests[^0-9]*([0-9]+).*#\1#p')
                  fi
                  if [ -n "$pr_num" ]; then
                    >&2 echo "ℹ️  Resolving PR #$pr_num head branch for marine-licensing-journey-tests"
                    local api_headers=("-H" "Accept: application/vnd.github+json")
                    if [ -n "$GITHUB_TOKEN" ]; then
                      api_headers+=("-H" "Authorization: Bearer $GITHUB_TOKEN")
                    fi
                    branch=$(curl -sS "https://api.github.com/repos/DEFRA/marine-licensing-journey-tests/pulls/$pr_num" "${api_headers[@]}" | jq -r '.head.ref // empty')
                  fi
                fi
              fi
            fi
          fi

          printf '%s' "$branch"
        }

        BRANCH_FROM_DEPENDS=""

        if [ -f "$DEPENDS_FILE" ]; then
          BRANCH_FROM_DEPENDS="$(resolve_branch_from_depends "$DEPENDS_FILE")"
          if [ -z "$BRANCH_FROM_DEPENDS" ]; then
            echo "ℹ️ depends-on.json did not contain an entry for DEFRA/marine-licensing-journey-tests"
          fi
        elif [ -f "$ROOT_DEPENDS_FILE" ]; then
          BRANCH_FROM_DEPENDS="$(resolve_branch_from_depends "$ROOT_DEPENDS_FILE")"
          if [ -z "$BRANCH_FROM_DEPENDS" ]; then
            echo "ℹ️ depends-on.json (root) did not contain an entry for DEFRA/marine-licensing-journey-tests"
          fi
        else
          echo "ℹ️ No depends-on.json found; using default branch $DEFAULT_BRANCH"
        fi

        if [ -n "$BRANCH_FROM_DEPENDS" ]; then
          if git ls-remote --exit-code --heads https://github.com/DEFRA/marine-licensing-journey-tests.git "$BRANCH_FROM_DEPENDS" >/dev/null 2>&1; then
            echo "✅ Using depends-on branch from depends-on action: $BRANCH_FROM_DEPENDS"
            BRANCH_TO_USE="$BRANCH_FROM_DEPENDS"
            echo "branch_discovered_source=depends-on-json" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Branch '$BRANCH_FROM_DEPENDS' from depends-on.json not found on remote; retaining default: $DEFAULT_BRANCH"
          fi
        fi

        echo "branch=$BRANCH_TO_USE" >> "$GITHUB_OUTPUT"
        echo "📦 Selected journey-tests branch: $BRANCH_TO_USE"

    - name: Alternative checkout attempt (only if called from different repo)
      if: github.repository != 'DEFRA/marine-licensing-journey-tests'
      run: |
        set -e
        rm -rf ./marine-licensing-journey-tests

        BRANCH_TO_USE='${{ steps.resolve_tests_branch.outputs.branch }}'
        DEFAULT_BRANCH='${{ inputs.branch }}'

        echo "Cloning marine-licensing-journey-tests branch: $BRANCH_TO_USE"
        git clone --branch "$BRANCH_TO_USE" --depth 1 https://github.com/DEFRA/marine-licensing-journey-tests.git ./marine-licensing-journey-tests || {
          echo "Falling back to default branch: $DEFAULT_BRANCH"
          git clone --branch "$DEFAULT_BRANCH" --depth 1 https://github.com/DEFRA/marine-licensing-journey-tests.git ./marine-licensing-journey-tests
        }

      shell: bash

    - name: Build marine-licensing-frontend image
      run: |
        echo "=== Building Frontend Image ==="
        echo "Current directory: $(pwd)"

        if [ -d "../../marine-licensing-frontend" ]; then
          echo "✅ Found frontend directory - building PR image"
          cd ../../marine-licensing-frontend
          echo "Branch: $(git branch --show-current) | Commit: $(git log -1 --oneline)"
          docker build -t defradigital/marine-licensing-frontend:pr-build .
          echo "✅ Frontend PR image built successfully"
        else
          echo "ℹ️  No frontend directory found - will use latest image"
          echo "This is normal if no frontend dependency was specified in PR description"
        fi
      shell: bash
      working-directory: ./marine-licensing-journey-tests

    - name: Build marine-licensing-backend image
      run: |
        echo "=== Building Backend Image ==="
        echo "Current directory: $(pwd)"

        if [ -d "../../marine-licensing-backend" ]; then
          echo "✅ Found backend directory - building PR image"
          cd ../../marine-licensing-backend
          echo "Branch: $(git branch --show-current) | Commit: $(git log -1 --oneline)"
          docker build -t defradigital/marine-licensing-backend:pr-build .
          echo "✅ Backend PR image built successfully"
        else
          echo "ℹ️  No backend directory found - will use latest image"
          echo "This is normal if no backend dependency was specified in PR description"
        fi
      shell: bash
      working-directory: ./marine-licensing-journey-tests

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./marine-licensing-journey-tests/package-lock.json

    - name: Setup the tests
      run: npm i
      shell: bash
      working-directory: ./marine-licensing-journey-tests

    - name: Start docker compose
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        # Priority: PR images > specified inputs > latest
        # Check if we built PR images and use them if available
        if docker image inspect defradigital/marine-licensing-frontend:pr-build >/dev/null 2>&1; then
          echo "✅ Using PR-built frontend image (from depends-on)"
          FRONTEND_VERSION="pr-build"
        else
          FRONTEND_VERSION="${{ inputs.marine-licensing-frontend }}"
          echo "ℹ️  Using frontend version: ${FRONTEND_VERSION:-latest} (no PR dependency)"
        fi

        if docker image inspect defradigital/marine-licensing-backend:pr-build >/dev/null 2>&1; then
          echo "✅ Using PR-built backend image (from depends-on)"
          BACKEND_VERSION="pr-build"
        else
          BACKEND_VERSION="${{ inputs.marine-licensing-backend }}"
          echo "ℹ️  Using backend version: ${BACKEND_VERSION:-latest} (no PR dependency)"
        fi

        echo "🐳 Starting containers with:"
        echo "  Frontend: ${FRONTEND_VERSION:-latest}"
        echo "  Backend: ${BACKEND_VERSION:-latest}"

        MARINE_LICENSING_FRONTEND_VERSION=${FRONTEND_VERSION:-latest} \
        MARINE_LICENSING_BACKEND_VERSION=${BACKEND_VERSION:-latest} \
        docker compose -f $(pwd)/compose.common.yml up --wait-timeout 300 -d --quiet-pull

    - name: Check initial service status
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        echo "=== Initial Docker Compose Status ==="
        docker compose -f $(pwd)/compose.common.yml ps
        echo "=== Service Logs (first 20 lines) ==="
        docker compose -f $(pwd)/compose.common.yml logs --tail=20 || echo "No logs available yet"

    - name: Wait for services to be ready
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        echo "Waiting for selenium-chrome to be ready..."
        timeout 120 bash -c 'until curl -f http://localhost:4444/wd/hub/status; do sleep 5; done'
        echo "Waiting for backend to be ready..."
        timeout 180 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'
        echo "Waiting for Defra ID stub to be ready..."
        timeout 120 bash -c 'until curl -f http://localhost:3200/health; do sleep 5; done'
        echo "Waiting for frontend to be ready..."
        timeout 180 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
        echo "All services are ready!"

    - name: Check service status
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        echo "=== Docker Compose Status ==="
        docker compose -f $(pwd)/compose.common.yml ps
        echo "=== Testing Service Connectivity ==="
        echo "Testing from runner to frontend..."
        curl --fail --silent --connect-timeout 5 http://localhost:3000/health || (echo "❌ Cannot reach frontend from runner!" && exit 1)
        echo "Testing from runner to defra-id-stub..."
        curl --fail --silent --connect-timeout 5 http://localhost:3200/health || (echo "❌ Cannot reach defra-id-stub from runner!" && exit 1)
        echo "Testing defra-id-stub API endpoint..."
        curl -v --connect-timeout 5 http://localhost:3200/cdp-defra-id-stub/API/register -X POST -H "Content-Type: application/json" -d '{"email":"test@example.com","password":"TestPassword123!","firstName":"Test","lastName":"User"}' || echo "Defra ID stub API test completed (may show expected errors)"
        echo "Testing from selenium container to frontend..."
        docker compose -f $(pwd)/compose.common.yml exec -T selenium-chrome curl --fail --silent --connect-timeout 5 http://marine-licensing-frontend:3000/health || (echo "❌ Cannot reach frontend from selenium container!" && exit 1)

    - name: Run the tests
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      env:
        CHROMEDRIVER_URL: localhost
        MULTI_SITE_PARALLEL: 15
        MAX_INSTANCES: 15
      run: |
        echo "=== Cleaning previous results ==="
        rm -rf allure-results allure-report
        echo "=== Running tests with MULTI_SITE_PARALLEL=$MULTI_SITE_PARALLEL and MAX_INSTANCES=$MAX_INSTANCES ==="
        MULTI_SITE_PARALLEL=15 npm run test:github

    - name: debug
      if: always()
      working-directory: ./marine-licensing-journey-tests
      run: |
        docker compose -f $(pwd)/compose.common.yml logs > logs.txt
        docker ps
      shell: bash

    - name: Generate Allure reports
      if: always()
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        echo "=== Counting test result files ==="
        ls -la allure-results/ | wc -l

        echo "=== Generating consolidated single-file HTML report (all runs) ==="
        npx allure-commandline@latest generate allure-results --clean --single-file --output allure-report-consolidated

        echo "=== Generating full interactive HTML report (all runs) ==="
        npx allure-commandline@latest generate allure-results --clean --output allure-report-full

        echo "=== Sanitizing filenames (removing colons and invalid chars) ==="
        # Fix any files with invalid characters in allure-report-full
        if [ -d "allure-report-full" ]; then
          find allure-report-full -depth -name '*:*' -o -name '*|*' -o -name '*<*' -o -name '*>*' -o -name '*?*' -o -name '*"*' | while read -r file; do
            newname=$(echo "$file" | sed 's/:/_/g; s/|/_/g; s/</_/g; s/>/_/g; s/?/_/g; s/"/_/g')
            if [ "$file" != "$newname" ]; then
              mv "$file" "$newname"
            fi
          done
        fi

        # Fix any files with invalid characters in allure-report-consolidated
        if [ -d "allure-report-consolidated" ]; then
          find allure-report-consolidated -depth -name '*:*' -o -name '*|*' -o -name '*<*' -o -name '*>*' -o -name '*?*' -o -name '*"*' | while read -r file; do
            newname=$(echo "$file" | sed 's/:/_/g; s/|/_/g; s/</_/g; s/>/_/g; s/?/_/g; s/"/_/g')
            if [ "$file" != "$newname" ]; then
              mv "$file" "$newname"
            fi
          done
        fi

        echo "=== Organizing results by thread/run ==="
        mkdir -p allure-reports-by-run

        # Extract run number from parameter in each result file
        run_count=0
        for file in allure-results/*-result.json; do
          if [ -f "$file" ]; then
            # Extract run number from the "Run Number" parameter
            runnum=$(grep -o '"name":"Run Number","value":"[^"]*"' "$file" | sed 's/.*"value":"\([^"]*\)".*/\1/' | head -1)
            
            # If Run Number not found, try to extract from thread label
            if [ -z "$runnum" ] || [ "$runnum" = "N/A" ]; then
              runnum=$(grep -o '"name":"thread","value":"Run-[0-9]*"' "$file" | sed 's/.*Run-\([0-9]*\).*/\1/' | head -1)
            fi
            
            # If still not found, assign sequential number
            if [ -z "$runnum" ] || [ "$runnum" = "N/A" ]; then
              runnum=$run_count
              run_count=$((run_count + 1))
            fi
            
            # Create directory for this run (sanitize the run number)
            runnum_clean=$(echo "$runnum" | tr -cd '0-9')
            if [ ! -z "$runnum_clean" ]; then
              mkdir -p "allure-results-run-$runnum_clean"
              # Copy all related files for this test
              cp "$file" "allure-results-run-$runnum_clean/"
              
              # Copy related attachments
              testId=$(basename "$file" | sed 's/-result.json//')
              for attachment in allure-results/*"$testId"*; do
                if [ -f "$attachment" ]; then
                  cp "$attachment" "allure-results-run-$runnum_clean/" 2>/dev/null || true
                fi
              done
            fi
          fi
        done

        # Copy container files to each run directory
        for container in allure-results/*-container.json; do
          if [ -f "$container" ]; then
            for rundir in allure-results-run-*; do
              cp "$container" "$rundir/" 2>/dev/null || true
            done
          fi
        done

        echo "=== Generating individual HTML reports for each run ==="
        for rundir in allure-results-run-*; do
          if [ -d "$rundir" ]; then
            runnum=$(echo "$rundir" | sed 's/allure-results-run-//')
            echo "Generating report for Run #$runnum"
            
            # Generate report to a clean directory name
            npx allure-commandline@latest generate "$rundir" --clean --single-file --output "allure-reports-by-run/run-$runnum"
            
            # Sanitize any files with invalid characters in this run's report
            if [ -d "allure-reports-by-run/run-$runnum" ]; then
              find "allure-reports-by-run/run-$runnum" -depth \( -name '*:*' -o -name '*|*' -o -name '*<*' -o -name '*>*' -o -name '*?*' -o -name '*"*' \) 2>/dev/null | while read -r file; do
                newname=$(echo "$file" | sed 's/:/_/g; s/|/_/g; s/</_/g; s/>/_/g; s/?/_/g; s/"/_/g')
                if [ "$file" != "$newname" ] && [ -e "$file" ]; then
                  mv "$file" "$newname" 2>/dev/null || true
                fi
              done
            fi
            
            # Copy index.html to a numbered report file
            if [ -f "allure-reports-by-run/run-$runnum/index.html" ]; then
              cp "allure-reports-by-run/run-$runnum/index.html" "allure-reports-by-run/run-$runnum-report.html"
              echo "✅ Created run-$runnum-report.html"
            fi
          fi
        done

        echo "=== Report generation complete ==="
        echo "📊 Consolidated report: allure-report-consolidated/index.html"
        echo "📊 Full report: allure-report-full/index.html"
        echo "📊 Individual run reports: allure-reports-by-run/run-{1..15}-report.html"
        ls -lh allure-reports-by-run/*.html 2>/dev/null || echo "No individual reports found"

    - name: Parse test results
      if: always() && github.event_name == 'pull_request'
      id: test-results
      shell: bash
      working-directory: ./marine-licensing-journey-tests
      run: |
        echo "=== Checking WebDriverIO Results First ==="

        # Check if WDIO created a FAILED file (more reliable than Allure for failures)
        if [ -f "FAILED" ]; then
          echo "Found FAILED file - reading WebDriverIO results"
          WDIO_RESULTS=$(cat FAILED)
          echo "WDIO Results: $WDIO_RESULTS"
        fi

        # Initialize counters
        PASSED=0
        FAILED=0
        BROKEN=0
        SKIPPED=0

        # Count test results from Allure (scenarios/steps level)
        if [ -d "allure-results" ]; then
          echo "=== Processing Allure result files ==="
          for file in allure-results/*-result.json; do
            if [ -f "$file" ]; then
              # Extract the status field more reliably using sed
              STATUS=$(sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$file" | head -1)
              case "$STATUS" in
                "passed")
                  PASSED=$((PASSED + 1))
                  ;;
                "failed")
                  FAILED=$((FAILED + 1))
                  ;;
                "broken")
                  BROKEN=$((BROKEN + 1))
                  ;;
                "skipped")
                  SKIPPED=$((SKIPPED + 1))
                  ;;
              esac
            fi
          done
        fi

        # If we have FAILED file but no failed tests in Allure, there's a discrepancy
        if [ -f "FAILED" ] && [ $FAILED -eq 0 ]; then
          echo "⚠️ DISCREPANCY DETECTED: WDIO shows failures but Allure shows none"
          echo "This indicates failed tests weren't captured by Allure reporter"
          
          # Extract failure count from WDIO results if possible
          if echo "$WDIO_RESULTS" | grep -q '"failed"'; then
            WDIO_FAILED=$(echo "$WDIO_RESULTS" | sed -n 's/.*"failed":\s*\([0-9]\+\).*/\1/p')
            if [ ! -z "$WDIO_FAILED" ] && [ "$WDIO_FAILED" -gt 0 ]; then
              echo "Using WDIO failed count: $WDIO_FAILED"
              FAILED=$WDIO_FAILED
              # Adjust total to account for failed tests not in Allure
              PASSED=$((PASSED - FAILED))
              if [ $PASSED -lt 0 ]; then PASSED=0; fi
            fi
          fi
        fi

        TOTAL=$((PASSED + FAILED + BROKEN + SKIPPED))

        # Determine status
        if [ $FAILED -eq 0 ] && [ $BROKEN -eq 0 ] && [ $TOTAL -gt 0 ]; then
          STATUS_EMOJI="✅"
          STATUS_TEXT="All tests passed"
        elif [ $TOTAL -eq 0 ]; then
          STATUS_EMOJI="⚠️"
          STATUS_TEXT="No tests were executed"
        else
          STATUS_EMOJI="❌"
          STATUS_TEXT="Test failures detected"
        fi

        # Calculate pass rate
        if [ $TOTAL -gt 0 ]; then
          PASS_RATE=$((PASSED * 100 / TOTAL))
        else
          PASS_RATE=0
        fi

        # Debug output
        echo "=== Test Results Summary ==="
        echo "Allure files processed: $(ls -1 allure-results/*-result.json 2>/dev/null | wc -l)"
        echo "TOTAL=$TOTAL, PASSED=$PASSED, FAILED=$FAILED, BROKEN=$BROKEN, SKIPPED=$SKIPPED"
        echo "PASS_RATE=$PASS_RATE%, STATUS_EMOJI=$STATUS_EMOJI, STATUS_TEXT=$STATUS_TEXT"
        echo "WDIO FAILED file exists: $([ -f 'FAILED' ] && echo 'YES' || echo 'NO')"

        # Set outputs
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "broken=$BROKEN" >> $GITHUB_OUTPUT
        echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
        echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        echo "status_emoji=$STATUS_EMOJI" >> $GITHUB_OUTPUT
        echo "status_text=$STATUS_TEXT" >> $GITHUB_OUTPUT

    - name: Find existing comment
      if: always() && github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v3
      id: find-comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Marine Licensing Journey Tests

    - name: Create or update PR comment with test results
      if: always() && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          ## Marine Licensing Journey Tests

          ### ${{ steps.test-results.outputs.status_emoji || '⚠️' }} ${{ steps.test-results.outputs.status_text || 'Test Results' }}

          | Metric | Count |
          |:-------|------:|
          | **Total Tests** | ${{ steps.test-results.outputs.total || '0' }} |
          | **Passed** | ${{ steps.test-results.outputs.passed || '0' }} |
          | **Failed** | ${{ steps.test-results.outputs.failed || '0' }} |
          | **Broken** | ${{ steps.test-results.outputs.broken || '0' }} |
          | **Skipped** | ${{ steps.test-results.outputs.skipped || '0' }} |
          | **Pass Rate** | ${{ steps.test-results.outputs.pass_rate || '0' }}% |

          ---

          **[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**

    - name: Upload Allure results (raw)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-raw
        path: ./marine-licensing-journey-tests/allure-results/
        retention-days: 30

    - name: Upload Full Allure report (interactive)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-full
        path: ./marine-licensing-journey-tests/allure-report-full/
        retention-days: 30

    - name: Upload Consolidated Allure report (single HTML)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-consolidated
        path: ./marine-licensing-journey-tests/allure-report-consolidated/
        retention-days: 30

    - name: Upload Individual Run Reports (15 separate HTMLs)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-reports-by-run
        path: ./marine-licensing-journey-tests/allure-reports-by-run/
        retention-days: 30

    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./marine-licensing-journey-tests/logs.txt

################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - localstack (s3, sqs, sns)
#
# Both mongo and localstack have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested can either be started up here using the latest
# builds from dockerhub.
# In the example each service has a .env config file in docker/config/
# Services can reference each other by their container names.
# e.g. http://cdp-example-node-backend:3001/
#
################################################################################
services:
  ################################################################################
  # Headless browser, used by the test suite to actually run the tests against the
  # containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    ports:
      - 4444:4444

  ################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3
  ################################################################################
  localstack:
    image: localstack/localstack:3.2.0
    environment:
      - LOCALSTACK_HOST=127.0.0.1
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./docker/config/defaults.env
    volumes:
      - ./docker/scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5
  ################################################################################
  #
  # Authentication Services
  #
  ################################################################################
  defra-id-stub:
    image: defradigital/cdp-defra-id-stub:latest
    ports:
      - 3200:3200
    environment:
      - PORT=3200
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3200/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # User registration init container
  defra-id-user-init:
    image: curlimages/curl:latest
    volumes:
      - ./user-stub.json:/user-stub.json
    command: >
      sh -c "
        echo 'Waiting for Defra ID stub to be ready...'
        until curl -f http://defra-id-stub:3200/health; do
          sleep 2
        done
        echo 'Registering initial test user...'
        curl -X POST -H 'Content-Type: application/json' \
             -d @/user-stub.json \
             http://defra-id-stub:3200/cdp-defra-id-stub/API/register
        echo 'User registration completed'
      "
    depends_on:
      defra-id-stub:
        condition: service_healthy

  ################################################################################
  #
  # Marine Licensing Application Services
  #
  ################################################################################
  marine-licensing-frontend:
    image: defradigital/marine-licensing-frontend:${MARINE_LICENSING_FRONTEND_VERSION:-latest}
    env_file:
      - ./docker/config/defaults.env
    environment:
      - PORT=3000
      - MARINE_LICENSING_BACKEND_API_URL=http://marine-licensing-backend:3001
    depends_on:
      marine-licensing-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      defra-id-stub:
        condition: service_healthy
      defra-id-user-init:
        condition: service_completed_successfully
    ports:
      - 3000:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      start_period: 30s
      retries: 5

  marine-licensing-backend:
    image: defradigital/marine-licensing-backend:${MARINE_LICENSING_BACKEND_VERSION:-latest}
    env_file:
      - ./docker/config/defaults.env
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/marine-licensing
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3001:3001
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      start_period: 30s
      retries: 5

################################################################################
# Docker Compose file for local development
# Uses local builds from ../marine-licensing-frontend, ../marine-licensing-backend,
# ../marine-licensing-api-stub, and ../marine-licensing-public-register
#
# For pipeline use, see compose.common.yml (uses pre-built Docker images)
################################################################################
services:
  redis-frontend:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6380:6379'
    restart: always
    networks:
      cdp-tenant:
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5

  defra-id-stub:
    image: defradigital/cdp-defra-id-stub:latest
    ports:
      - '3200:3200'
    restart: unless-stopped
    env_file:
      - compose/aws.env
    environment:
      PORT: 3200
      REDIS_HOST: redis-frontend
      REDIS_PORT: 6379
      USE_SINGLE_INSTANCE_CACHE: true
      SESSION_CACHE_NAME: defraIdStubSession
      NODE_ENV: development
      APP_BASE_URL: ${DEFRA_ID_APP_BASE_URL:-http://defra-id-stub:3200}
      REGISTRATIONS_STORE_ENGINE: dynamodb
      REGISTRATIONS_STORE_TTL: 259200000
      AWS_DYNAMODB_REGISTRATIONS_TABLE_NAME: cdp-defra-id-stub-registrations
      DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_REGION: eu-west-2
    depends_on:
      redis-frontend:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3200/health']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      cdp-tenant:
        aliases:
          - localhost

  marine-licensing-frontend:
    build: ../marine-licensing-frontend
    ports:
      - '3000:3000'
    restart: unless-stopped
    env_file:
      - 'compose/aws.env'
      - './docker/config/defaults.env'
    environment:
      PORT: 3000
      NODE_ENV: development
      USE_SINGLE_INSTANCE_CACHE: true
      SESSION_CACHE_ENGINE: redis
      MARINE_LICENSING_BACKEND_API_URL: http://marine-licensing-backend:3001
      CDP_UPLOADER_BASE_URL: http://cdp-uploader:7337
      APP_BASE_URL: ${FRONTEND_APP_BASE_URL:-http://marine-licensing-frontend:3000}
      DEFRA_ID_OIDC_CONFIGURATION_URL: http://defra-id-stub:3200/cdp-defra-id-stub/.well-known/openid-configuration
      ENTRA_ID_OIDC_CONFIGURATION_URL: http://defra-id-stub:3200/cdp-defra-id-stub/.well-known/openid-configuration
      REDIS_HOST: redis-frontend
      REDIS_PORT: 6379
      DEFRA_ID_REDIRECT_HOSTS: http://defra-id-stub:3200,http://localhost:3200
      ENABLE_MARINE_LICENCE: true
      ENABLE_SELF_SERVICE: true
      # Without these the frontend falls back to localhost:3002, which inside the
      # container is the frontend itself, so the invoicee address lookup fails.
      MARINE_LICENSING_ADDRESS_LOOKUP_API_URL: http://marine-licensing-api-stub:3002/api/address-lookup/v2.1/addresses
      MARINE_LICENSING_ADDRESS_LOOKUP_OAUTH_TOKEN_URL: http://marine-licensing-api-stub:3002/oauth2/v2.0/token
      MARINE_LICENSING_PUBLIC_REGISTER_API_URL: http://marine-licensing-public-register:3003
    command: 'node .'
    depends_on:
      marine-licensing-backend:
        condition: service_healthy
      marine-licensing-public-register:
        condition: service_healthy
      redis-frontend:
        condition: service_healthy
    networks:
      - cdp-tenant
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      start_period: 30s
      retries: 5

  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    restart: unless-stopped
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose,dynamodb
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  redis:
    image: redis:7
    restart: always
    networks:
      - cdp-tenant
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5

  mongodb:
    # Single-member replica set so the backend under test supports Mongo
    # transactions, matching deployed environments. The healthcheck initiates
    # the set idempotently, so healthy implies initiated and writable.
    image: mongo:7.0.24
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    networks:
      - cdp-tenant
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
        ]
      interval: 5s
      timeout: 30s
      start_period: 5s
      start_interval: 1s
      retries: 30

  cdp-uploader:
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-latest}
    ports:
      - '7337:7337'
    restart: unless-stopped
    links:
      - 'localstack:localstack'
      - 'redis:redis'
    depends_on:
      localstack:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      VIRTUAL_HOST: ~^uploader\..*\.sslip\.io
      VIRTUAL_PATH: /
      VIRTUAL_PORT: 7337
      PORT: 7337
      NODE_ENV: development
      REDIS_HOST: redis
      APP_BASE_URL: http://cdp-uploader:7337
      USE_SINGLE_INSTANCE_CACHE: true
      MOCK_VIRUS_SCAN_ENABLED: true
      MOCK_VIRUS_RESULT_DELAY: 3
      MOCK_VIRUS_REGEX: '.*virus.*'
      CONSUMER_BUCKETS: '${CDP_UPLOAD_BUCKET:-mmo-uploads},cdp-uploader-quarantine'
      SQS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
    networks:
      - cdp-tenant

  marine-licensing-api-stub:
    build:
      context: ../marine-licensing-api-stub
      target: production
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: development
    ports:
      - '3002:3002'
    networks:
      - cdp-tenant
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/health']
      interval: 10s
      start_period: 30s
      retries: 5

  marine-licensing-backend:
    build: ../marine-licensing-backend
    restart: unless-stopped
    env_file:
      - './docker/config/defaults.env'
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/marine-licensing
      - DEFRA_ID_JWKS_URI=http://defra-id-stub:3200/cdp-defra-id-stub/.well-known/jwks.json
      - ARCGIS_FEATURE_SERVER_URL=http://marine-licensing-api-stub:3002/ArcGIS/rest/services/PolicyData_MDP/FeatureServer/0
      - PUBLIC_REGISTER_SNS_ENABLED=true
    depends_on:
      marine-licensing-api-stub:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - 3001:3001
    networks:
      - cdp-tenant
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      start_period: 30s
      retries: 5

  marine-licensing-public-register:
    build:
      context: ../marine-licensing-public-register
      target: development
    restart: unless-stopped
    env_file:
      - 'compose/aws.env'
      - './docker/config/defaults.env'
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DATABASE: marine-licensing-public-register
      SQS_ENDPOINT: http://localstack:4566
      PUBLIC_REGISTER_SQS_ENABLED: 'true'
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - 3003:3003
    networks:
      - cdp-tenant
    volumes:
      - ../marine-licensing-public-register/src:/home/node/src
      - ../marine-licensing-public-register/package.json:/home/node/package.json
      # node --watch crashes if --env-file-if-exists=.env points at a missing file
      - ../marine-licensing-public-register/.env:/home/node/.env
    healthcheck:
      # development image has wget, not curl
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3003/health']
      interval: 10s
      start_period: 30s
      retries: 5

networks:
  cdp-tenant:
    driver: bridge
volumes:
  mongodb-data:
